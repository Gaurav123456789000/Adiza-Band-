<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adiza — Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/contact.css">
  </head>
  <body>
    <header class="navbar">
      <div class="nav-wrap">
        <a href="index.html#home" class="logo" aria-label="Adiza home">
          <img src="/assets/adiza-logo.webp" alt="Adiza">
        </a>

        <div class="nav-bar">
          <span class="nav-layer nav-lens" aria-hidden="true"></span>
          <span class="nav-layer nav-tint" aria-hidden="true"></span>
          <span class="nav-layer nav-light" aria-hidden="true"></span>
          <span class="nav-layer nav-edge" aria-hidden="true"></span>

          <nav class="nav-primary" aria-label="Main navigation">
            <ul class="nav-links" id="primary-navigation">
              <li class="nav-indicator" aria-hidden="true" data-ready="false"></li>
              <li><a class="nav-link" href="index.html#home">Home</a></li>
              <li><a class="nav-link" href="about.html">About Band</a></li>
              <li><a class="nav-link" href="index.html#services">Services</a></li>
              <li><a class="nav-link" href="index.html#gallery">Media Gallery</a></li>
              <li><a class="nav-link" href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
          </nav>

          <button class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primary-navigation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path class="burger-open-icon" d="M4 7h16M4 12h16M4 17h16"></path>
              <path class="burger-close-icon" d="M6 6l12 12M18 6L6 18"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main contact-page" id="contact">
      <div class="contact-inner">
        <section class="contact-copy" aria-labelledby="contact-title">
          <p class="contact-eyebrow">Contact Adiza</p>
          <h1 id="contact-title">Let’s make your event <span>unforgettable</span></h1>
          <p>Planning a celebration or live event? Share a few details and tell us what kind of music would make the moment yours.</p>
        </section>

        <form class="contact-form" id="contact-form">
          <div class="contact-fields">
            <div class="contact-field">
              <label for="contact-name">Your name</label>
              <input id="contact-name" name="name" autocomplete="name" placeholder="Name" required>
            </div>
            <div class="contact-field">
              <label for="contact-email">Email address</label>
              <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="contact-field">
              <label for="event-type">Event type</label>
              <select id="event-type" name="eventType" required>
                <option value="" selected disabled>Select an event</option>
                <option>Wedding</option>
                <option>Private celebration</option>
                <option>Corporate event</option>
                <option>Other</option>
              </select>
            </div>
            <div class="contact-field">
              <label for="event-date">Event date</label>
              <input id="event-date" name="eventDate" type="date">
            </div>
            <div class="contact-field full">
              <label for="contact-message">Tell us about your event</label>
              <textarea id="contact-message" name="message" placeholder="Share the location, audience size, and any music preferences."></textarea>
            </div>
          </div>
          <div class="honeypot" aria-hidden="true">
            <label for="contact-website">Leave this field blank</label>
            <input id="contact-website" name="website" tabindex="-1" autocomplete="off">
          </div>
          __TURNSTILE_WIDGET__
          <button class="contact-submit" type="submit">Send Inquiry</button>
          <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>
    __TURNSTILE_SCRIPT__
    <script src="/assets/js/contact.js" defer></script>
  </body>
</html>
